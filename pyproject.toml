[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "issue2md"
version = "0.1.0"
description = "Convert GitHub Issues/PRs/Discussions to Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["github", "markdown", "cli", "issue", "pull-request"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "responses>=0.23.0",
]

[project.scripts]
issue2md = "issue2md.__main__:main"

[project.urls]
Homepage = "https://github.com/shunchaoyin/my-issue2md"
Repository = "https://github.com/shunchaoyin/my-issue2md"
Issues = "https://github.com/shunchaoyin/my-issue2md/issues"

[tool.setuptools.packages.find]
include = ["issue2md*"]

[tool.setuptools.package-data]
issue2md = ["py.typed"]
